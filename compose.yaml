services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: kyp
      POSTGRES_USER: kyp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kyp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyp -d kyp"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  kyp_postgres:
